version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: painel-professores-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: painel_professores
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
